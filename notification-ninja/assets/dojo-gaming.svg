<path d="M342 60h83v512h-83ZM1175 60h83v512h-83ZM37 20h82v574H37ZM1481 20h82v574h-82Z" fill="url(#pillar)" stroke="#11182f" stroke-width="7"/>
<path d="M357 108v406M1224 108v406M96 105v405M1505 105v405" stroke="#83ccdf" stroke-width="3" opacity=".7"/>
