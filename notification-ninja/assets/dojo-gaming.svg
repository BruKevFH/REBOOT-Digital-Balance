<path d="M113 116h218v35H113Zm1156 0h214v35h-214Z" fill="#151f3d" stroke="#6379a5" stroke-width="4"/>
<path d="M122 151h202v232H122Zm1154 0h201v232h-201Z" fill="url(#screen)" opacity=".3"/>
