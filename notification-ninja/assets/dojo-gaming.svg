<ellipse cx="292" cy="188" rx="187" ry="201" fill="url(#light)"/><ellipse cx="1308" cy="188" rx="187" ry="201" fill="url(#lightPurple)"/>
<use href="#lantern" x="235" y="72" width="113" height="207"/><use href="#lantern" x="1252" y="72" width="113" height="207"/>
<path d="m1272 132 1 93q35 18 72 0l-1-93Z" fill="url(#violet)" opacity=".42"/>
