<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Cyber Ninja Dojo</title>
<desc id="desc">Original blue and violet Japanese cyber temple, with luminous paper lanterns, a quiet city garden and an open training floor.</desc>
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#090e30"/><stop offset=".55" stop-color="#35366f"/><stop offset="1" stop-color="#84639c"/></linearGradient>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#25284e"/><stop offset="1" stop-color="#131d41"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#424274"/><stop offset=".5" stop-color="#262b53"/><stop offset="1" stop-color="#111d3e"/></linearGradient>
 <linearGradient id="pillar"><stop stop-color="#171d3a"/><stop offset=".3" stop-color="#575384"/><stop offset=".65" stop-color="#282b54"/><stop offset="1" stop-color="#11182f"/></linearGradient>
 <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#b8fdff"/><stop offset=".5" stop-color="#72d6f0"/><stop offset="1" stop-color="#4065b1"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#f3c9ff"/><stop offset=".5" stop-color="#c193ec"/><stop offset="1" stop-color="#7859ab"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#3f6192"/><stop offset="1" stop-color="#142744"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#e2e4ff"/><stop offset=".72" stop-color="#bbbeef"/><stop offset="1" stop-color="#9890cf"/></radialGradient>
 <radialGradient id="light"><stop stop-color="#8de6f4" stop-opacity=".24"/><stop offset="1" stop-color="#8de6f4" stop-opacity="0"/></radialGradient>
 <radialGradient id="lightPurple"><stop stop-color="#cc9aea" stop-opacity=".25"/><stop offset="1" stop-color="#cc9aea" stop-opacity="0"/></radialGradient>
 <pattern id="woven" width="12" height="5" patternUnits="userSpaceOnUse"><path d="M0 1h12" stroke="#d9ccfa" opacity=".035"/></pattern>
 <pattern id="screen" width="42" height="60" patternUnits="userSpaceOnUse"><path d="M0 0h42v60H0Z" fill="none" stroke="#88a9d3" stroke-width="2" opacity=".35"/></pattern>
 <symbol id="lantern" viewBox="0 0 120 220">
  <path d="M60 0v47" stroke="#8796bd" stroke-width="5"/><path d="M19 54q41-20 82 0l7 100q-48 23-96 0Z" fill="url(#cyan)" stroke="#19233e" stroke-width="6"/>
  <path d="M19 54q41 11 82 0M14 83q46 16 92 0M14 113q46 16 92 0M13 143q47 18 94 0" fill="none" stroke="#d4faff" stroke-width="2" opacity=".65"/>
  <path d="M34 51v106m26-110v119m26-116v107" stroke="#41608c" stroke-width="3" opacity=".5"/><path d="M23 167h74M35 175h50M60 177v25m-8 0h16" stroke="#bbb4e4" stroke-width="5"/>
 </symbol>
 <symbol id="stone" viewBox="0 0 100 70"><path d="M4 58 15 26 43 9 74 14 96 42 92 61Z" fill="#373e66" stroke="#101c36" stroke-width="4"/><path d="m15 26 33-5 26-7-9 23-33 9Z" fill="#555684"/></symbol>
</defs>
<!-- Every shape is authored for Notification Ninja; no linked artwork or fonts. -->
<path fill="url(#night)" d="M0 0h1600v900H0z"/>
<g fill="#dddcff" opacity=".7"><circle cx="164" cy="170" r="2"/><circle cx="344" cy="245" r="2"/><circle cx="1242" cy="174" r="2"/><circle cx="1378" cy="239" r="3"/><circle cx="1482" cy="149" r="2"/><circle cx="1210" cy="312" r="2"/><circle cx="286" cy="355" r="2"/></g>
<circle cx="1300" cy="221" r="98" fill="url(#moon)" opacity=".92"/>
<path d="M1215 202q92-33 181 3m-161 45q74-24 144-5" fill="none" stroke="#dfd7f8" stroke-width="8" opacity=".22"/>
