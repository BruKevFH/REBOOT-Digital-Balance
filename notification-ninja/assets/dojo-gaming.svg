<path d="m89 384 34-25 38 13 7 26-42 14Z" fill="#547d90"/><path d="m141 356 30-21 36 17-6 30-49 7Z" fill="#7386a8"/><path d="m177 404 40-21 28 20-4 27-51 2Z" fill="#527c90"/>
