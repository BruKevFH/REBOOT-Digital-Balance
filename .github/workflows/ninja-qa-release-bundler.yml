name: Notification Ninja 3.0.1 - temporary release bundler
on:
  push:
    branches:
      - fix/ninja-v3-qa-20261102
    paths:
      - '.github/workflows/ninja-qa-release-bundler.yml'
      - 'scripts/build_ninja.mjs'
      - 'scripts/package_ninja.py'
      - 'notification-ninja/sw.js'
      - 'notification-ninja/index.html'
      - 'notification-ninja/src/**'
permissions:
  contents: write
jobs:
  build-package-commit:
    if: github.repository == 'BruKevFH/REBOOT-Digital-Balance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build 3.0.1 bundles
        run: npm run build:ninja
      - name: Run Ninja regression suite
        run: npm run test:ninja
      - name: Create and check ZIP 3.0.1
        run: npm run package:ninja
      - name: Verify the source and build versions match
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const root='notification-ninja/';
          const m=JSON.parse(readFileSync(root+'dist/build.json','utf8'));
          assert.equal(m.version,'3.0.1');
          assert(readFileSync(root+'sw.js','utf8').includes('3.0.1'));
          const game=readFileSync(root+'dist/ninja.js','utf8');
          const home=readFileSync(root+'dist/home.js','utf8');
          assert(game.includes('delete-local-only-option'));
          assert(home.includes('18 Hauptmissionen'));
          for(const a of [root+'index.html',root+'downloads/Notification-Ninja-3.0.1.zip.sha256'])
            assert(readFileSync(a,'utf8').includes('Notification-Ninja-3.0.1.zip'));
          NODE
      - name: Commit only reproducible release files to the QA branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- notification-ninja/dist/home.js notification-ninja/dist/ninja.js notification-ninja/dist/build.json notification-ninja/downloads/Notification-Ninja-3.0.1.zip notification-ninja/downloads/Notification-Ninja-3.0.1.zip.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'build(ninja): check in reproducible 3.0.1 release files'
            git push origin HEAD:refs/heads/fix/ninja-v3-qa-20261102
          fi
