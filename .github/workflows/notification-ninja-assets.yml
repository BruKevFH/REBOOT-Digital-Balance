name: Notification Ninja build and publish generated assets

on:
  push:
    branches: [main]
    paths:
      - 'notification-ninja/src/**'
      - 'notification-ninja/index.html'
      - 'notification-ninja/home.html'
      - 'notification-ninja/focus-ui.css'
      - 'notification-ninja/focus-home.css'
      - 'notification-ninja/legend-ui.css'
      - 'notification-ninja/legend-home.css'
      - 'notification-ninja/worlds-v2.css'
      - 'notification-ninja/ux-v2.css'
      - 'notification-ninja/ui-navigation-v3.css'
      - 'notification-ninja/illustrated-adventure-v4.css'
      - 'notification-ninja/dojo-worlds-v5.css'
      - 'notification-ninja/assets/dojo-*-v5.svg'
      - 'notification-ninja/assets/overworld-landscape-v4.svg'
      - 'notification-ninja/assets/dojo-*-v2.svg'
      - 'notification-ninja/sw.js'
      - 'scripts/build_ninja.mjs'
      - 'scripts/package_ninja.py'
      - '.github/workflows/notification-ninja-assets.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: ninja-build-assets-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ninja
      - run: npm run build:ninja
      - run: npm run package:ninja
      - name: Commit production bundles and reproducible download
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notification-ninja/dist/ninja.js notification-ninja/dist/home.js notification-ninja/dist/build.json
          git add notification-ninja/downloads/Notification-Ninja-3.5.0.zip notification-ninja/downloads/Notification-Ninja-3.5.0.zip.sha256
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "build(ninja): publish tested focus-first browser bundles [skip ci]"
            git push origin HEAD:main
          fi

      - name: Request Pages rebuild after asset release
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
          # Explicitly publish the generated dist/ and ZIP revision.
          gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Verify public 3.5.0 assets after Pages rebuild
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          site="https://brukevfh.github.io/REBOOT-Digital-Balance/notification-ninja"
          for attempt in {1..10}; do
            live="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "$site/dist/build.json?release=${GITHUB_RUN_ID}-${attempt}" | jq -r '.version // empty' || true)"
            if [ "$live" = "3.5.0" ]; then
              curl -fsSL --max-time 10 "$site/illustrated-adventure-v4.css?release=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/nn-v4.css"
              grep -q 'nn-village-stage' "$RUNNER_TEMP/nn-v4.css"
              curl -fsSL --max-time 10 "$site/assets/overworld-landscape-v4.svg?release=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/nn-v4.svg"
              grep -q 'Ninja-Dojo-Welten' "$RUNNER_TEMP/nn-v4.svg"
              echo "PUBLIC VISUAL RELEASE 3.5.0 CONFIRMED"
              exit 0
            fi
            echo "Pages still serves version: ${live:-unknown} (attempt ${attempt})"
            sleep 6
          done
          echo "::warning::Public GitHub Pages still serves an older build."
          exit 1
