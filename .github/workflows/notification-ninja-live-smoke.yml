name: Notification Ninja live account API smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/notification-ninja-live-smoke.yml'
      - 'scripts/verify_ninja_deployment.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ninja-live-readonly-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Render account API and Neon PostgreSQL (read-only)
        run: npm run verify:ninja:deployment -- https://notification-ninja-accounts.onrender.com
      - name: Explain scope of the test
        if: success()
        run: |
          echo "Read-only checks passed: API v3, durable PostgreSQL flag, public leaderboard, account config, GitHub Pages CORS."
          echo "Still required before public account enablement: real test accounts, verified progress, Render restart, persistent data, cleanup and privacy details."
