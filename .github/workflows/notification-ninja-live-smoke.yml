name: Notification Ninja live account API smoke

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/notification-ninja-live-smoke.yml'
      - 'scripts/verify_ninja_deployment.mjs'
      - 'server/**'
      - 'notification-ninja/src/**'
      - 'notification-ninja/dist/**'
      - 'notification-ninja/assets/**'
      - 'notification-ninja/*.css'
      - 'notification-ninja/*.html'
      - 'notification-ninja/sw.js'
      - 'notification-ninja/theme-boot.js'
      - 'notification-ninja/accounts-config.json'
      - 'scripts/build_ninja.mjs'
      - 'scripts/build_ninja_static.mjs'
      - 'scripts/check_ninja_313.cjs'
      - 'scripts/check_ninja_public_guest.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ninja-live-readonly-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Render account API and Neon PostgreSQL (read-only)
        env:
          NINJA_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          ninja_live_log="$RUNNER_TEMP/ninja-live-preflight.log"
          for attempt in {1..18}; do
            if npm run verify:ninja:deployment -- https://notification-ninja-accounts.onrender.com > "$ninja_live_log" 2>&1; then
              cat "$ninja_live_log"
              exit 0
            fi
            tail -8 "$ninja_live_log"
            if [ "$attempt" -lt 18 ]; then sleep 20; fi
          done
          {
            printf '### Production account deployment check failed\n\n```text\n'
            tail -30 "$ninja_live_log"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - run: npm ci --ignore-scripts
      - name: Build the expected static homepage and game
        env:
          RENDER_GIT_COMMIT: ${{ github.sha }}
        run: npm run build:ninja:site
      - run: npx playwright install --with-deps chromium
      - name: Verify canonical homepage and game as a public guest
        env:
          NINJA_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/check_ninja_public_guest.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ninja-public-guest-acceptance
          path: test-results/ninja-public-guest
          if-no-files-found: ignore
      - name: Explain scope of the test
        if: success()
        run: |
          echo "Read-only checks passed: expected source revision, API v3, durable PostgreSQL flag, public leaderboard, account config, GitHub Pages and static-site CORS, matching static assets and native guest navigation."
          echo "This does not replace account mutation or restart-persistence tests; it creates no production test data."
