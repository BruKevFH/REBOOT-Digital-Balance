name: Notification Ninja checks
on:
  pull_request:
    paths:
      - 'notification-ninja/**'
      - 'server/**'
      - 'tests/ninja*.mjs'
      - 'scripts/build_ninja.mjs'
      - 'scripts/package_ninja.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notification-ninja-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'notification-ninja/**'
      - 'server/**'
      - 'tests/ninja*.mjs'
      - 'scripts/build_ninja.mjs'
      - 'scripts/package_ninja.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notification-ninja-checks.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ninja_test
          POSTGRES_PASSWORD: local-integration-only
          POSTGRES_DB: ninja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ninja_test:local-integration-only@127.0.0.1:5432/ninja_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:ninja
      - run: npm run test:ninja
      - run: npx playwright install --with-deps chromium
      - name: Browser account portal and guest gameplay
        env:
          NINJA_BASE_URL: http://127.0.0.1:8083/notification-ninja/
        run: |
          export DATA_DIR="$(mktemp -d)"
          npm run serve:ninja > "$RUNNER_TEMP/ninja-server.log" 2>&1 &
          ninja_pid=$!
          trap 'kill "$ninja_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8083/api/v3/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8083/api/v3/health
          node scripts/check_ninja_portal.cjs
          npm run test:ninja:browser
      - run: npm run package:ninja
      - name: Verify bundled entry and offline homepage routes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          import vm from 'node:vm';
          const root='notification-ninja/';
          const index=readFileSync(root+'index.html','utf8');
          assert.match(index,/<script\s+src="\.\/dist\/ninja\.js"\s+defer><\/script>/);
          new vm.Script(readFileSync(root+'dist/ninja.js','utf8'));
          const metadata=JSON.parse(readFileSync(root+'dist/build.json','utf8'));
          assert.equal(metadata.entry,'index.html');
          const home=readFileSync(root+'home.html','utf8');
          assert(home.includes('href="./index.html"'));
          assert.match(home, /<script\s+src="\.\/dist\/home\.js"\s+defer><\/script>/);
          new vm.Script(readFileSync(root+'dist/home.js','utf8'));
          const handlers=new Map(),cached=[];
          const cache={addAll:async assets=>cached.push(...assets),match:async url=>({cachedUrl:url})};
          const scope='https://example.test/REBOOT-Digital-Balance/notification-ninja/';
          const context={URL,self:{registration:{scope},skipWaiting:async()=>{},addEventListener:(type,fn)=>handlers.set(type,fn)},caches:{open:async name=>{assert(name.endsWith(metadata.version));return cache;}},fetch:async()=>{throw new Error('Offline');}};
          vm.runInNewContext(readFileSync(root+'sw.js','utf8'),context);
          let install;
          handlers.get('install')({waitUntil:promise=>install=promise});
          await install;
          for(const asset of cached)assert(existsSync(root+(asset==='./'?'index.html':asset.slice(2))),asset);
          assert(cached.includes('./home.html'));
          assert(cached.includes('./dist/ninja.js'));
          assert(cached.includes('./dist/home.js'));
          assert(!cached.some(asset=>asset.startsWith('./src/')));
          for(const [path,expected]of [['home.html?source=install','home.html'],['index.html?v='+metadata.version,'index.html'],['','index.html']]){
            let response;
            handlers.get('fetch')({request:{method:'GET',url:scope+path,mode:'navigate'},respondWith:promise=>response=promise});
            assert(response,path);
            assert.equal((await response).cachedUrl,scope+expected);
          }
          let unrelated=false;
          handlers.get('fetch')({request:{method:'GET',url:scope+'unknown-page.html',mode:'navigate'},respondWith:()=>unrelated=true});
          assert.equal(unrelated,false);
          console.log('Bundled runtime, complete precache and distinct homepage/game offline routes verified.');
          NODE
