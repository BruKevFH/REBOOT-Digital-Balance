name: Notification Ninja checks
on:
  pull_request:
    paths:
      - 'notification-ninja/**'
      - 'server/**'
      - 'tests/ninja*.mjs'
      - 'scripts/build_ninja.mjs'
      - 'scripts/package_ninja.py'
      - 'scripts/check_ninja_portal.cjs'
      - 'scripts/check_ninja_browser.cjs'
      - 'scripts/check_ninja_live.mjs'
      - 'scripts/check_ninja_indie.cjs'
      - 'scripts/check_ninja_experience.cjs'
      - 'scripts/check_ninja_crossflows.cjs'
      - 'scripts/check_ninja_all_pages.cjs'
      - 'scripts/check_ninja_account_audit.mjs'
      - 'scripts/check_ninja_313.cjs'
      - 'scripts/check_ninja_auto_ranking.cjs'
      - 'scripts/check_ninja_compact.cjs'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notification-ninja-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'notification-ninja/**'
      - 'server/**'
      - 'tests/ninja*.mjs'
      - 'scripts/build_ninja.mjs'
      - 'scripts/package_ninja.py'
      - 'scripts/check_ninja_portal.cjs'
      - 'scripts/check_ninja_browser.cjs'
      - 'scripts/check_ninja_live.mjs'
      - 'scripts/check_ninja_indie.cjs'
      - 'scripts/check_ninja_experience.cjs'
      - 'scripts/check_ninja_crossflows.cjs'
      - 'scripts/check_ninja_all_pages.cjs'
      - 'scripts/check_ninja_account_audit.mjs'
      - 'scripts/check_ninja_313.cjs'
      - 'scripts/check_ninja_auto_ranking.cjs'
      - 'scripts/check_ninja_compact.cjs'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/notification-ninja-checks.yml'
concurrency:
  group: ninja-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ninja_test
          POSTGRES_PASSWORD: local-integration-only
          POSTGRES_DB: ninja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ninja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ninja_test:local-integration-only@127.0.0.1:5432/ninja_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cancel superseded main checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const response=await fetch(base+'/actions/workflows/notification-ninja-checks.yml/runs?branch=main&per_page=20',{headers});
          if(!response.ok)throw new Error('Could not inspect older Ninja checks: HTTP '+response.status);
          const {workflow_runs:runs}=await response.json();
          for(const run of runs){
            if(String(run.id)===process.env.GITHUB_RUN_ID||run.event!=='push'||!['queued','in_progress','waiting'].includes(run.status)||run.run_number>=Number(process.env.GITHUB_RUN_NUMBER))continue;
            const canceled=await fetch(base+'/actions/runs/'+run.id+'/cancel',{method:'POST',headers});
            if(![202,409].includes(canceled.status))throw new Error('Could not stop superseded run '+run.id+': HTTP '+canceled.status);
            console.log('Superseded Ninja check stopped: '+run.id);
          }
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run build:ninja
      - run: npm run test:ninja
      - name: Isolated account economy and process-restart audit
        run: node scripts/check_ninja_account_audit.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser account portal and guest gameplay
        env:
          NINJA_BASE_URL: http://127.0.0.1:8083/notification-ninja/
        run: |
          export DATA_DIR="$(mktemp -d)"
          export NINJA_MFA_KEY="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          npm run serve:ninja > "$RUNNER_TEMP/ninja-server.log" 2>&1 &
          ninja_pid=$!
          trap 'kill "$ninja_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8083/api/v3/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8083/api/v3/health
          for ninja_check in check_ninja_portal check_ninja_indie check_ninja_browser check_ninja_experience check_ninja_crossflows check_ninja_all_pages check_ninja_313 check_ninja_auto_ranking check_ninja_compact; do
            ninja_log="$RUNNER_TEMP/${ninja_check}.log"
            printf '::group::Notification Ninja: %s\n' "$ninja_check"
            if NINJA_CAPTURE_SCREENSHOTS=0 node "scripts/${ninja_check}.cjs" > "$ninja_log" 2>&1; then
              cat "$ninja_log"
              printf -- '- Passed: `%s`\n' "$ninja_check" >> "$GITHUB_STEP_SUMMARY"
              printf '::endgroup::\n'
            else
              cat "$ninja_log"
              printf '::endgroup::\n'
              printf '::error title=Notification Ninja browser suite::%s failed; see the step summary and its log.\n' "$ninja_check"
              {
                printf '### Notification Ninja: %s failed\n\n```text\n' "$ninja_check"
                tail -100 "$ninja_log"
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
      - run: npm run package:ninja
      - name: Verify bundled entry and offline homepage routes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          import vm from 'node:vm';
          const root='notification-ninja/';
          const index=readFileSync(root+'index.html','utf8');
          assert.match(index,/<script\s+src="\.\/dist\/ninja\.js"\s+defer><\/script>/);
          new vm.Script(readFileSync(root+'dist/ninja.js','utf8'));
          const metadata=JSON.parse(readFileSync(root+'dist/build.json','utf8'));
          assert.equal(metadata.entry,'index.html');
          const home=readFileSync(root+'home.html','utf8');
          for(const route of ['login','register','guest'])assert(home.includes('href="./index.html#'+route+'"'));
          assert(!home.includes('href="./index.html"'),'No direct play link from public info page');
          assert.match(home, /<script\s+src="\.\/dist\/home\.js"\s+defer><\/script>/);
          new vm.Script(readFileSync(root+'dist/home.js','utf8'));
          const handlers=new Map(),cached=[];
          const cache={addAll:async assets=>cached.push(...assets),match:async url=>({cachedUrl:url})};
          const scope='https://example.test/REBOOT-Digital-Balance/notification-ninja/';
          const context={URL,self:{registration:{scope},skipWaiting:async()=>{},addEventListener:(type,fn)=>handlers.set(type,fn)},caches:{open:async name=>{assert(name.endsWith(metadata.version));return cache;}},fetch:async()=>{throw new Error('Offline');}};
          vm.runInNewContext(readFileSync(root+'sw.js','utf8'),context);
          let install;
          handlers.get('install')({waitUntil:promise=>install=promise});
          await install;
          for(const asset of cached)assert(existsSync(root+(asset==='./'?'index.html':asset.slice(2))),asset);
          assert(cached.includes('./home.html'));
          assert(cached.includes('./dist/ninja.js'));
          assert(cached.includes('./dist/home.js'));
          assert(!cached.some(asset=>asset.startsWith('./src/')));
          for(const [path,expected]of [['home.html?source=install','home.html'],['index.html?v='+metadata.version,'index.html'],['','index.html']]){
            let response;
            handlers.get('fetch')({request:{method:'GET',url:scope+path,mode:'navigate'},respondWith:promise=>response=promise});
            assert(response,path);
            assert.equal((await response).cachedUrl,scope+expected);
          }
          let unrelated=false;
          handlers.get('fetch')({request:{method:'GET',url:scope+'unknown-page.html',mode:'navigate'},respondWith:()=>unrelated=true});
          assert.equal(unrelated,false);
          console.log('Bundled runtime, complete precache and distinct homepage/game offline routes verified.');
          NODE
