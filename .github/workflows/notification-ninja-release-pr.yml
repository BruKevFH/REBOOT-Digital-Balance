name: Stage Notification Ninja 3.5.0 release assets in PR
on:
  pull_request:
    paths:
      - 'notification-ninja/release-notes-3.5.0.md'
      - '.github/workflows/notification-ninja-release-pr.yml'
permissions:
  contents: write
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/notification-ninja-3.5.0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:ninja
      - run: npm run test:ninja
      - run: npm run package:ninja
      - name: Commit actual distribution and offline ZIP to release branch
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RELEASE_BRANCH"
          git add notification-ninja/dist/ninja.js notification-ninja/dist/home.js notification-ninja/dist/build.json
          git add notification-ninja/downloads/Notification-Ninja-3.5.0.zip notification-ninja/downloads/Notification-Ninja-3.5.0.zip.sha256
          if git diff --cached --quiet; then
            echo "Release 3.5.0 bundles already staged."
          else
            git commit -m "build(ninja): stage real illustrated 3.5.0 bundles for Pages deployment"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi
